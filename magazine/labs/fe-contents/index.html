/* Layout: one open-call page at a time, in the magazine's own palette; each study is a full landing. */

:root[data-theme="dark"]{--paper:#15130f;--card:#1f1c17;--ink:#efe9dd;--mute:#b9b1a4;--rule:#3a342b;--navy:#1a2340;--gold:#e2b072;--teal:#86c6d1;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui)}

.iss .se{margin:0;font:600 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.iss h2{margin:4px 0}.iss .hm{margin:0;font-size:15px;color:var(--mute)}
.iss ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}.iss li{display:grid;grid-template-columns:14px 1fr;column-gap:10px}.iss li::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;margin-top:7px;grid-row:1/3}
.iss li b{font:600 15px var(--ui)}.iss li:not(.on):not(.done) b{font-weight:500}.iss li span{font-size:15px;color:var(--mute)}.iss li.done::before{background:currentColor}.iss li.on::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in oklab,var(--gold) 25%,transparent)}.iss.now li.on::before{background:var(--blush);border-color:var(--blush);box-shadow:0 0 0 4px color-mix(in oklab,var(--blush) 30%,transparent)}

/* spruce */
