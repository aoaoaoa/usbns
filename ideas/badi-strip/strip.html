<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badí‘ Strip</title><style>:root{--paper:#f5f1e8;--card:#fdfcf9;--ink:#1d1a16;--mute:#6a635a;--rule:#d9d2c4;--text:"Literata",Georgia,serif;--ui:"Bricolage Grotesque",system-ui,sans-serif}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui)}.wrap{max-width:1240px;margin:0 auto;padding:0 16px}/* dateline above the header */
.dl{background:var(--paper);border-bottom:1px solid var(--rule);font-family:var(--ui);font-size:12.5px;color:var(--mute)}
.dl>summary{list-style:none;cursor:pointer}.dl>summary::-webkit-details-marker{display:none}
.dl .dr{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;min-height:34px;padding-top:6px;padding-bottom:6px}
.dl .bd{color:var(--ink);font-weight:600;letter-spacing:.02em}.dl .bd b{font-family:var(--text);font-size:14px}
.dl .gd{flex:1;min-width:0}
.dl .nx{color:var(--ink)}.dl .nx i{font-style:normal;color:var(--gold-ns,#b8782e);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-right:6px}
.dl .tg{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--link)}
.dl .tg svg{width:12px;height:12px;transition:transform .25s}.dl[open] .tg svg{transform:rotate(180deg)}
.dl>summary:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.dl .panel{border-top:1px solid var(--rule);background:var(--card)}
.dl .panel .wrap{padding-top:14px;padding-bottom:16px}
.dl .calft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}.dl .calft p{margin-bottom:0}.dl .caltag{margin:0 0 0 auto;text-align:right;font:italic 400 13px "Literata",Georgia,serif;color:var(--mute)}
.cal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:stretch}
.today{background:#222e4c;color:#f2cfc6;border-radius:4px;padding:12px 16px;display:grid;align-content:center;gap:2px;min-width:170px}
.today .k{font:700 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.today .d{font:300 30px/1 "Barlow Condensed","Arial Narrow",sans-serif}.today .d b{font-weight:700}
.today .m{font:italic 14px/1.3 var(--text)}
.today .y{display:none}.today .ring{display:none}
.up{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.up li{display:grid;gap:2px;padding:2px 14px;border-left:1px solid var(--rule);align-content:start}
.up li:first-child{border-left:0;padding-left:0}
.up .when{font:700 10.5px/1.25 var(--ui);color:#b8782e;text-transform:uppercase;letter-spacing:.06em}
.up .when b{font:700 13px var(--ui);color:var(--ink);letter-spacing:0;text-transform:none;margin-left:4px}
.up h4{margin:0;font:700 14px/1.3 var(--text);color:var(--ink)}.up p{margin:0;font-size:12px;line-height:1.35;color:var(--mute)}
.calnote{font-size:11.5px;color:var(--mute);margin:8px 0 0}
@media (max-width:760px){.cal{grid-template-columns:1fr}.up{grid-template-columns:1fr 1fr;gap:10px 0}.up li:nth-child(3){border-left:0;padding-left:0}.dl .gd{display:none}.dl .nx{flex-basis:100%;order:3}}

</style></head><body><!-- nsadd:cal --><details class="dl"><summary><div class="wrap dr"><span class="bd" id="dl-b">183 B.E.</span><span class="gd" id="dl-g"></span><span class="nx" id="dl-n"></span><span class="tg">Holy Days and Feasts <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div></summary><div class="panel"><div class="wrap"><div class="cal"><div class="today"><span class="k">In the Badí‘ calendar</span><div><div class="d" id="cal-d"></div><div class="m" id="cal-m"></div></div><div class="y" id="cal-y"></div><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/></svg></div><div><ul class="up" id="cal-up"></ul><div class="calft"><p class="calnote">Each Bahá’í day begins at sunset the evening before.</p><p class="caltag">The Rhythm of Bahá’í Life</p></div></div></div></div></div></details>
<script>(function(){var M=[["Bahá", "Splendor", "2026-03-21"], ["Jalál", "Glory", "2026-04-09"], ["Jamál", "Beauty", "2026-04-28"], ["‘Aẓamat", "Grandeur", "2026-05-17"], ["Núr", "Light", "2026-06-05"], ["Raḥmat", "Mercy", "2026-06-24"], ["Kalimát", "Words", "2026-07-13"], ["Kamál", "Perfection", "2026-08-01"], ["Asmá’", "Names", "2026-08-20"], ["‘Izzat", "Might", "2026-09-08"], ["Mashíyyat", "Will", "2026-09-27"], ["‘Ilm", "Knowledge", "2026-10-16"], ["Qudrat", "Power", "2026-11-04"], ["Qawl", "Speech", "2026-11-23"], ["Masá’il", "Questions", "2026-12-12"], ["Sharaf", "Honor", "2026-12-31"], ["Sulṭán", "Sovereignty", "2027-01-19"], ["Mulk", "Dominion", "2027-02-07"]],E=[["2026-11-10", "Anniversary of the Birth of the Báb", "7 Qudrat · work is to be suspended"], ["2026-11-11", "Anniversary of the Birth of Bahá'u'lláh", "8 Qudrat · work is to be suspended"], ["2026-11-23", "Feast of Qawl", "Speech"], ["2026-11-26", "Day of the Covenant", "4 Qawl · work is not to be suspended"], ["2026-11-28", "Ascension of ‘Abdu'l-Bahá", "6 Qawl · work is not to be suspended"], ["2026-12-12", "Feast of Masá'il", "Questions"], ["2026-12-31", "Feast of Sharaf", "Honor"]];var d=new Date();var mid=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);function day(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2],12)}var cur=-1;for(var i=0;i<M.length;i++){if(day(M[i][2])<=mid)cur=i}var bd=document.getElementById('dl-b'),g=document.getElementById('dl-g');g.textContent=mid.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('cal-y').textContent='183 B.E. · '+g.textContent;if(cur>=0){var n=Math.round((mid-day(M[cur][2]))/864e5)+1;if(n>=1&&n<=19){bd.innerHTML='<b>'+n+' '+M[cur][0]+'</b> · 183 B.E.';document.getElementById('cal-d').innerHTML='<b>'+n+'</b> '+M[cur][0];document.getElementById('cal-m').textContent='The month of '+M[cur][1]}}var up=document.getElementById('cal-up'),k=0,first=null;E.forEach(function(e){var t=day(e[0]);if(t<mid||k>=4)return;k++;var dd=Math.round((t-mid)/864e5);var w=dd===0?'Today':dd===1?'Tomorrow':'In '+dd+' days';if(!first)first=[w,e[1]];var li=document.createElement('li');li.innerHTML='<span class="when">'+w+'<b>'+t.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</b></span><div><h4></h4><p></p></div>';li.querySelector('h4').textContent=e[1];li.querySelector('p').textContent=e[2];up.appendChild(li)});var nx=document.getElementById('dl-n');if(first){nx.innerHTML='<i>'+first[0]+'</i>';nx.appendChild(document.createTextNode(first[1]))}else{up.innerHTML='<li><span class="when">Next</span><div><h4>With the next issue</h4><p>Each issue carries the Holy Days and Feasts ahead.</p></div></li>'}})();</script><!-- /nsadd:cal --><p style="max-width:60ch;margin:40px auto;padding:0 16px;color:#6a635a">The Badí‘ dateline strip from the landing page, with its Holy Days panel. Opened by default below.</p></body></html>
